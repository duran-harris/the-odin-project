<html>
<head>
  <title>Tic Tac Toe</title>
  <link type="text/css" rel="stylesheet" href="./ticTacToe.css">
</head>
<body>
<section id="scoreBoard">
  <div class="player-one">
    <div>
      <label for="player-one-name">
        Player One Name
      </label>
      <input id="player-one-name" type="text" value="Duran"/>
    </div>
    <div>
      Score: <span id="player-one-score">0</span>
    </div>
    <div>
      Symbol : <span id="player-one-icon" class="player-one-icon-color">x</span>
    </div>
  </div>
  <div>
    <button id="start-game-btn" onclick="gameController.startGame();">Start Game!</button>
  </div>
  <div>
    <button id="reset-game-btn" onclick="window.location.reload();" style="visibility:hidden">Reset</button>
  </div>
  <div class="player-two">
    <div>
      <label for="player-two-name">
        Player Two Name
      </label>
      <input id="player-two-name" type="text" value="Duran's computer"/>
    </div>
    <div>
      Score: <span id="player-two-score">0</span>
    </div>
    <div>
      Symbol : <span id="player-two-icon" class="player-two-icon-color">o</span>
    </div>
  </div>
</section>

<div id="gameBoard">
  <div class="gameTile">
  </div>
  <div class="gameTile">
  </div>
  <div class="gameTile">
  </div>

  <div class="gameTile">
  </div>
  <div class="gameTile">
  </div>
  <div class="gameTile">
  </div>

  <div class="gameTile">
  </div>
  <div class="gameTile">
  </div>
  <div class="gameTile">
  </div>
</div>

<script type="text/javascript" src="./ticTacToe.js"></script>
</body>
</html>
